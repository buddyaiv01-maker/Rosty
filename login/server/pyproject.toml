[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "DTZ"]
ignore = [
    "B008",  # FastAPI's `Depends()`/`Query()` in argument defaults is the required idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"app/email_utils.py" = ["E501"]  # inline HTML/CSS email template strings, not code
